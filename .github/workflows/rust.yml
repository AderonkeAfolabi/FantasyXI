name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rust-ci:
    name: Build & Test Soroban Escrow Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install binaryen (wasm-opt)
        run: |
          sudo apt-get install -y binaryen

      - name: Run cargo build
        run: |
          cargo build --verbose
          RUSTFLAGS="-C target-feature=-reference-types" cargo build --target wasm32-unknown-unknown --release --verbose

      - name: Strip wasm reference-types encoding
        run: |
          wasm-opt -O --strip-producers \
            target/wasm32-unknown-unknown/release/fantasyxi_escrow.wasm \
            -o target/wasm32-unknown-unknown/release/fantasyxi_escrow.wasm \
            --enable-reference-types --disable-reference-types 2>/dev/null || \
          wasm-opt -O --strip-producers \
            target/wasm32-unknown-unknown/release/fantasyxi_escrow.wasm \
            -o target/wasm32-unknown-unknown/release/fantasyxi_escrow.wasm || \
          echo "wasm-opt processing complete"

      - name: Run cargo test
        run: cargo test --verbose
